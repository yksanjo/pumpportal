[project]
name = "pumpportal"
version = "0.1.0"
description = "Terminal-based pump.fun explorer. Browse live launches, filter, inspect, and get notified — all from your terminal."
authors = [{ name = "Yoshi Kondo", email = "yoshi@musicailab.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["solana", "pumpfun", "tui", "terminal", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
pumpportal = "pumpportal.__main__:cli"

[project.urls]
Homepage = "https://github.com/yksanjo/pumpportal"
Repository = "https://github.com/yksanjo/pumpportal"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pumpportal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
